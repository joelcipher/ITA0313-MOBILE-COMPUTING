<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Computing CO3 Assessment - 4 App Prototypes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for mobile screens */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Glassmorphism styling */
        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-2 sm:p-6">

    <!-- Header & Student Info -->
    <header class="w-full max-w-6xl flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-800/80 p-4 rounded-2xl border border-slate-700 shadow-xl mb-4">
        <div>
            <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 text-xs font-semibold bg-indigo-500/20 text-indigo-400 rounded-md border border-indigo-500/30">ITA03 - Mobile Computing</span>
                <span class="px-2 py-0.5 text-xs font-semibold bg-emerald-500/20 text-emerald-400 rounded-md border border-emerald-500/30">CO3 Assessment</span>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-white mt-1">Mobile App UI Design Prototypes</h1>
            <p class="text-xs text-slate-400">Student: Joel Benn John B | Reg. No: 1911260003</p>
        </div>
        
        <!-- App Switcher Top Tabs -->
        <div class="flex flex-wrap gap-2 justify-center bg-slate-900/80 p-1.5 rounded-xl border border-slate-700/60">
            <button onclick="switchApp(1)" id="app-btn-1" class="app-tab-btn active-tab px-3 py-2 text-xs sm:text-sm font-medium rounded-lg transition-all flex items-center gap-2 bg-indigo-600 text-white shadow-lg">
                <i data-lucide="heart-handshake" class="w-4 h-4"></i> 1. Health & Self-Care
            </button>
            <button onclick="switchApp(2)" id="app-btn-2" class="app-tab-btn px-3 py-2 text-xs sm:text-sm font-medium rounded-lg transition-all flex items-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800">
                <i data-lucide="briefcase" class="w-4 h-4"></i> 2. Job Assistant
            </button>
            <button onclick="switchApp(3)" id="app-btn-3" class="app-tab-btn px-3 py-2 text-xs sm:text-sm font-medium rounded-lg transition-all flex items-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800">
                <i data-lucide="parking-square" class="w-4 h-4"></i> 3. Parking Finder
            </button>
            <button onclick="switchApp(4)" id="app-btn-4" class="app-tab-btn px-3 py-2 text-xs sm:text-sm font-medium rounded-lg transition-all flex items-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800">
                <i data-lucide="dumb-bell" class="w-4 h-4" style="transform: rotate(-45deg);"></i> 4. Body Fitness
            </button>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-6 items-start my-auto">
        
        <!-- Left Side: Interactive Smartphone Frame -->
        <div class="lg:col-span-6 flex flex-col items-center justify-center">
            <!-- iPhone Frame Mockup -->
            <div class="relative w-[340px] sm:w-[380px] h-[720px] bg-slate-950 rounded-[48px] p-4 border-[6px] border-slate-800 shadow-[0_0_50px_rgba(79,70,229,0.25)] flex flex-col justify-between overflow-hidden">
                
                <!-- Notch / Dynamic Island -->
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-slate-950 rounded-b-2xl z-50 flex items-center justify-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-slate-900 border border-slate-800"></div>
                    <div class="w-2 h-2 rounded-full bg-slate-900 border border-slate-800"></div>
                </div>

                <!-- Status Bar -->
                <div class="w-full flex justify-between items-center px-4 pt-1 text-[11px] font-semibold text-slate-400 z-40 select-none">
                    <span>09:41</span>
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="wifi" class="w-3 h-3"></i>
                        <i data-lucide="battery" class="w-3.5 h-3.5"></i>
                    </div>
                </div>

                <!-- App Screen Inner View Container -->
                <div id="phone-screen" class="w-full h-full bg-slate-900 rounded-[32px] overflow-hidden flex flex-col justify-between relative text-slate-800 mt-2 border border-slate-800/50">
                    
                    <!-- DYNAMIC APP CONTENT INSERTED HERE VIA JS -->
                    <div id="app-viewport" class="w-full h-full overflow-y-auto no-scrollbar pb-16">
                        <!-- Content loads dynamically -->
                    </div>

                    <!-- Bottom Nav Bar (Inside Phone) -->
                    <nav id="app-bottom-nav" class="absolute bottom-0 inset-x-0 h-16 bg-white/90 backdrop-blur-md border-t border-slate-200/80 flex justify-around items-center px-2 z-30">
                        <!-- Dynamic Sub-Nav Links -->
                    </nav>
                </div>

                <!-- Home Indicator Bar -->
                <div class="w-32 h-1 bg-slate-600 rounded-full mx-auto my-1 z-50"></div>
            </div>
        </div>

        <!-- Right Side: Pseudocode & Logic Panel -->
        <div class="lg:col-span-6 bg-slate-800/80 border border-slate-700 rounded-2xl p-5 shadow-xl h-[720px] flex flex-col justify-between overflow-hidden">
            <div>
                <div class="flex items-center justify-between pb-3 border-b border-slate-700">
                    <div class="flex items-center gap-2">
                        <i data-lucide="code-2" class="w-5 h-5 text-indigo-400"></i>
                        <h2 id="pseudocode-title" class="font-bold text-white text-lg">App 1 Pseudocode & Architecture</h2>
                    </div>
                    <span class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full font-mono">Mobile IP / Cellular Routing</span>
                </div>

                <!-- Pseudocode Display Area -->
                <div class="mt-4 bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs font-mono text-emerald-400 h-[580px] overflow-y-auto no-scrollbar space-y-4">
                    <div id="pseudocode-content">
                        <!-- Pseudocode will be rendered here dynamically based on active app -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Global Toast Notification Modal -->
    <div id="toast" class="fixed bottom-6 right-6 bg-indigo-600 text-white text-sm px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0 flex items-center gap-2 z-50">
        <i data-lucide="check-circle-2" class="w-4 h-4"></i>
        <span id="toast-message">Action successful!</span>
    </div>

    <!-- Application Script Logic -->
    <script>
        // State Machine for Mobile Applications
        const state = {
            activeApp: 1,
            subScreen: 'login',
            health: {
                bookmarks: new Set(),
                activeArticle: null
            },
            job: {
                subscription: 'Free',
                uploadedFile: null,
                appliedJobs: new Set(),
                searchQuery: ''
            },
            parking: {
                emptyCount: 14,
                bookedSlot: null,
                selectedZone: null
            },
            fitness: {
                subscription: false,
                caloriesLogged: 1450,
                selectedVideo: null
            }
        };

        // Initialize Lucide Icons
        window.onload = function() {
            lucide.createIcons();
            switchApp(1);
        };

        // App Switcher Engine
        function switchApp(appId) {
            state.activeApp = appId;
            
            // Update Top Tab Styles
            document.querySelectorAll('.app-tab-btn').forEach((btn, index) => {
                if (index + 1 === appId) {
                    btn.className = "app-tab-btn active-tab px-3 py-2 text-xs sm:text-sm font-medium rounded-lg transition-all flex items-center gap-2 bg-indigo-600 text-white shadow-lg";
                } else {
                    btn.className = "app-tab-btn px-3 py-2 text-xs sm:text-sm font-medium rounded-lg transition-all flex items-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800";
                }
            });

            // Set default view for selected app
            if (appId === 1) switchSubScreen('health-login');
            else if (appId === 2) switchSubScreen('job-login');
            else if (appId === 3) switchSubScreen('parking-login');
            else if (appId === 4) switchSubScreen('fitness-login');

            renderPseudocode(appId);
        }

        // Sub Screen Switcher within Phone
        function switchSubScreen(screenId) {
            state.subScreen = screenId;
            const viewport = document.getElementById('app-viewport');
            const nav = document.getElementById('app-bottom-nav');

            switch(screenId) {
                // APP 1: HEALTH & SELF CARE
                case 'health-login':
                    viewport.innerHTML = renderHealthLogin();
                    nav.innerHTML = renderNav(['health-login', 'health-register', 'health-routine', 'health-selfcare'], ['log-in', 'user-plus', 'activity', 'heart']);
                    break;
                case 'health-register':
                    viewport.innerHTML = renderHealthRegister();
                    nav.innerHTML = renderNav(['health-login', 'health-register', 'health-routine', 'health-selfcare'], ['log-in', 'user-plus', 'activity', 'heart']);
                    break;
                case 'health-routine':
                    viewport.innerHTML = renderHealthRoutine();
                    nav.innerHTML = renderNav(['health-login', 'health-register', 'health-routine', 'health-selfcare'], ['log-in', 'user-plus', 'activity', 'heart']);
                    break;
                case 'health-selfcare':
                    viewport.innerHTML = renderHealthSelfcare();
                    nav.innerHTML = renderNav(['health-login', 'health-register', 'health-routine', 'health-selfcare'], ['log-in', 'user-plus', 'activity', 'heart']);
                    break;

                // APP 2: INTELLIGENT JOB ASSISTANT
                case 'job-login':
                    viewport.innerHTML = renderJobLogin();
                    nav.innerHTML = renderNav(['job-login', 'job-sub', 'job-details', 'job-resume', 'job-board'], ['log-in', 'badge-percent', 'user', 'file-up', 'briefcase']);
                    break;
                case 'job-sub':
                    viewport.innerHTML = renderJobSubscription();
                    nav.innerHTML = renderNav(['job-login', 'job-sub', 'job-details', 'job-resume', 'job-board'], ['log-in', 'badge-percent', 'user', 'file-up', 'briefcase']);
                    break;
                case 'job-details':
                    viewport.innerHTML = renderJobDetails();
                    nav.innerHTML = renderNav(['job-login', 'job-sub', 'job-details', 'job-resume', 'job-board'], ['log-in', 'badge-percent', 'user', 'file-up', 'briefcase']);
                    break;
                case 'job-resume':
                    viewport.innerHTML = renderJobResume();
                    nav.innerHTML = renderNav(['job-login', 'job-sub', 'job-details', 'job-resume', 'job-board'], ['log-in', 'badge-percent', 'user', 'file-up', 'briefcase']);
                    break;
                case 'job-board':
                    viewport.innerHTML = renderJobBoard();
                    nav.innerHTML = renderNav(['job-login', 'job-sub', 'job-details', 'job-resume', 'job-board'], ['log-in', 'badge-percent', 'user', 'file-up', 'briefcase']);
                    break;

                // APP 3: PARKING SLOT FINDER
                case 'parking-login':
                    viewport.innerHTML = renderParkingLogin();
                    nav.innerHTML = renderNav(['parking-login', 'parking-count', 'parking-display', 'parking-booking'], ['log-in', 'gauge', 'map-pin', 'calendar-check']);
                    break;
                case 'parking-count':
                    viewport.innerHTML = renderParkingCount();
                    nav.innerHTML = renderNav(['parking-login', 'parking-count', 'parking-display', 'parking-booking'], ['log-in', 'gauge', 'map-pin', 'calendar-check']);
                    break;
                case 'parking-display':
                    viewport.innerHTML = renderParkingDisplay();
                    nav.innerHTML = renderNav(['parking-login', 'parking-count', 'parking-display', 'parking-booking'], ['log-in', 'gauge', 'map-pin', 'calendar-check']);
                    break;
                case 'parking-booking':
                    viewport.innerHTML = renderParkingBooking();
                    nav.innerHTML = renderNav(['parking-login', 'parking-count', 'parking-display', 'parking-booking'], ['log-in', 'gauge', 'map-pin', 'calendar-check']);
                    break;

                // APP 4: ONLINE BODY FITNESS
                case 'fitness-login':
                    viewport.innerHTML = renderFitnessLogin();
                    nav.innerHTML = renderNav(['fitness-login', 'fitness-register', 'fitness-blog', 'fitness-diet', 'fitness-videos', 'fitness-pay'], ['log-in', 'user-plus', 'newspaper', 'utensils', 'video', 'credit-card']);
                    break;
                case 'fitness-register':
                    viewport.innerHTML = renderFitnessRegister();
                    nav.innerHTML = renderNav(['fitness-login', 'fitness-register', 'fitness-blog', 'fitness-diet', 'fitness-videos', 'fitness-pay'], ['log-in', 'user-plus', 'newspaper', 'utensils', 'video', 'credit-card']);
                    break;
                case 'fitness-blog':
                    viewport.innerHTML = renderFitnessBlog();
                    nav.innerHTML = renderNav(['fitness-login', 'fitness-register', 'fitness-blog', 'fitness-diet', 'fitness-videos', 'fitness-pay'], ['log-in', 'user-plus', 'newspaper', 'utensils', 'video', 'credit-card']);
                    break;
                case 'fitness-diet':
                    viewport.innerHTML = renderFitnessDiet();
                    nav.innerHTML = renderNav(['fitness-login', 'fitness-register', 'fitness-blog', 'fitness-diet', 'fitness-videos', 'fitness-pay'], ['log-in', 'user-plus', 'newspaper', 'utensils', 'video', 'credit-card']);
                    break;
                case 'fitness-videos':
                    viewport.innerHTML = renderFitnessVideos();
                    nav.innerHTML = renderNav(['fitness-login', 'fitness-register', 'fitness-blog', 'fitness-diet', 'fitness-videos', 'fitness-pay'], ['log-in', 'user-plus', 'newspaper', 'utensils', 'video', 'credit-card']);
                    break;
                case 'fitness-pay':
                    viewport.innerHTML = renderFitnessPay();
                    nav.innerHTML = renderNav(['fitness-login', 'fitness-register', 'fitness-blog', 'fitness-diet', 'fitness-videos', 'fitness-pay'], ['log-in', 'user-plus', 'newspaper', 'utensils', 'video', 'credit-card']);
                    break;
            }

            lucide.createIcons();
        }

        // Render Dynamic Sub-Navigation Bar
        function renderNav(screens, icons) {
            return screens.map((screen, idx) => {
                const isActive = state.subScreen === screen;
                const activeStyle = isActive ? "text-indigo-600 font-bold scale-110" : "text-slate-400 hover:text-slate-600";
                return `
                    <button onclick="switchSubScreen('${screen}')" class="flex flex-col items-center justify-center p-2 transition-all ${activeStyle}">
                        <i data-lucide="${icons[idx]}" class="w-5 h-5"></i>
                    </button>
                `;
            }).join('');
        }

        // Show Toast Function
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // ==========================================
        // APP 1 VIEWS: HEALTH & SELF-CARE
        // ==========================================
        function renderHealthLogin() {
            return `
                <div class="p-6 flex flex-col justify-between h-full bg-emerald-50/50">
                    <div class="mt-8 text-center">
                        <div class="w-16 h-16 bg-emerald-500 text-white rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-emerald-500/30">
                            <i data-lucide="heart-pulse" class="w-8 h-8"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-800 mt-4">ZenFlow</h2>
                        <p class="text-xs text-slate-500 mt-1">Health & Mindfulness Self-Care</p>
                    </div>

                    <form onsubmit="event.preventDefault(); switchSubScreen('health-routine'); showToast('Welcome back to ZenFlow!');" class="space-y-4 my-auto">
                        <div>
                            <label class="text-xs font-semibold text-slate-600">Email Address</label>
                            <input type="email" required placeholder="joel@example.com" class="w-full mt-1 px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-600">Password</label>
                            <input type="password" required placeholder="••••••••" class="w-full mt-1 px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-emerald-600/20">Sign In</button>
                    </form>

                    <p class="text-xs text-center text-slate-500">Don't have an account? <a href="#" onclick="switchSubScreen('health-register')" class="text-emerald-600 font-semibold">Register</a></p>
                </div>
            `;
        }

        function renderHealthRegister() {
            return `
                <div class="p-6 flex flex-col justify-between h-full bg-emerald-50/50">
                    <div class="mt-4">
                        <h2 class="text-xl font-bold text-slate-800">Create Account</h2>
                        <p class="text-xs text-slate-500">Start your self-care journey today</p>
                    </div>

                    <form onsubmit="event.preventDefault(); switchSubScreen('health-routine'); showToast('Account Registered Successfully!');" class="space-y-3 my-auto">
                        <div>
                            <label class="text-xs font-semibold text-slate-600">Full Name</label>
                            <input type="text" required placeholder="Joel Benn John B" class="w-full mt-1 px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-600">Email</label>
                            <input type="email" required placeholder="joel@example.com" class="w-full mt-1 px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-600">Password</label>
                            <input type="password" required placeholder="••••••••" class="w-full mt-1 px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold shadow-md">Register Now</button>
                    </form>

                    <p class="text-xs text-center text-slate-500">Already registered? <a href="#" onclick="switchSubScreen('health-login')" class="text-emerald-600 font-semibold">Log In</a></p>
                </div>
            `;
        }

        function renderHealthRoutine() {
            return `
                <div class="p-4 bg-slate-50 min-h-full">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h2 class="text-lg font-bold text-slate-800">Daily Health Routines</h2>
                            <p class="text-xs text-slate-500">Curated habits for physical wellbeing</p>
                        </div>
                        <span class="p-2 bg-emerald-100 text-emerald-600 rounded-full"><i data-lucide="sun" class="w-4 h-4"></i></span>
                    </div>

                    <div class="space-y-3">
                        <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-3">
                            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center font-bold">01</div>
                            <div class="flex-1">
                                <h3 class="text-xs font-bold text-slate-800">Morning Diaphragmatic Breathing</h3>
                                <p class="text-[10px] text-slate-400">10 mins • Lower Cortisol</p>
                            </div>
                            <button onclick="showToast('Started Breathing Session')" class="p-2 text-emerald-600 hover:bg-emerald-50 rounded-lg"><i data-lucide="play" class="w-4 h-4"></i></button>
                        </div>
                        <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-3">
                            <div class="w-12 h-12 bg-teal-100 text-teal-600 rounded-xl flex items-center justify-center font-bold">02</div>
                            <div class="flex-1">
                                <h3 class="text-xs font-bold text-slate-800">Hydration & Electrolyte Reset</h3>
                                <p class="text-[10px] text-slate-400">500ml Water • Morning Habit</p>
                            </div>
                            <button onclick="showToast('Water logged!')" class="p-2 text-teal-600 hover:bg-teal-50 rounded-lg"><i data-lucide="check" class="w-4 h-4"></i></button>
                        </div>
                        <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-3">
                            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center font-bold">03</div>
                            <div class="flex-1">
                                <h3 class="text-xs font-bold text-slate-800">Post-Work Spine Mobility</h3>
                                <p class="text-[10px] text-slate-400">15 mins • Posture Care</p>
                            </div>
                            <button onclick="showToast('Stretching routine loaded!')" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg"><i data-lucide="play" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHealthSelfcare() {
            const blogs = [
                { id: 1, title: 'Overcoming Burnout with Micro-Breaks', tag: 'Mindfulness', time: '4 min read' },
                { id: 2, title: 'The Science of Sleep Hygiene & Rest', tag: 'Sleep Science', time: '6 min read' },
                { id: 3, title: 'Journaling Prompts for Anxiety Relief', tag: 'Mental Health', time: '3 min read' }
            ];

            return `
                <div class="p-4 bg-slate-50 min-h-full">
                    <h2 class="text-lg font-bold text-slate-800 mb-1">Self-Care Blogs</h2>
                    <p class="text-xs text-slate-500 mb-4">Mindfulness & stress management</p>

                    <div class="space-y-3">
                        ${blogs.map(blog => `
                            <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm">
                                <span class="text-[9px] font-bold px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-md">${blog.tag}</span>
                                <h3 class="text-xs font-bold text-slate-800 mt-2">${blog.title}</h3>
                                <div class="flex justify-between items-center mt-3 pt-2 border-t border-slate-100 text-[10px] text-slate-400">
                                    <span>${blog.time}</span>
                                    <button onclick="toggleBookmark(${blog.id})" class="text-slate-400 hover:text-emerald-600">
                                        <i data-lucide="bookmark" class="w-4 h-4 ${state.health.bookmarks.has(blog.id) ? 'fill-emerald-600 text-emerald-600' : ''}"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function toggleBookmark(id) {
            if (state.health.bookmarks.has(id)) {
                state.health.bookmarks.delete(id);
                showToast('Removed from Bookmarks');
            } else {
                state.health.bookmarks.add(id);
                showToast('Article Bookmarked!');
            }
            switchSubScreen('health-selfcare');
        }

        // ==========================================
        // APP 2 VIEWS: INTELLIGENT JOB ASSISTANT
        // ==========================================
        function renderJobLogin() {
            return `
                <div class="p-6 flex flex-col justify-between h-full bg-slate-900 text-white">
                    <div class="mt-8 text-center">
                        <div class="w-16 h-16 bg-indigo-600 text-white rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-indigo-500/30">
                            <i data-lucide="sparkles" class="w-8 h-8"></i>
